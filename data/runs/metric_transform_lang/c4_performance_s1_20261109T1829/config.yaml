agent:
  binary: claude
  cost_limits:
    cost_limit: 0
    net_cost_limit: 0
    step_limit: 300
  disallowed_tools:
  - WebFetch
  - WebSearch
  env:
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
  extra_args:
  - --strict-mcp-config
  - --mcp-config
  - '''{"mcpServers":{}}'''
  permission_mode: bypassPermissions
  type: claude_code
  version: 2.1.310
agent_config_path: configs/agents/claude_code_parnas.yaml
environment:
  commands:
    agent_command: python
    command: uv run
    entry_file: '{entry_file}.py'
  docker:
    image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    mount_workspace: true
    network: scb-cellnet
    workdir: /workspace
  environment:
    env:
      HTTPS_PROXY: http://scb-egress-agent:8888
      HTTP_PROXY: http://scb-egress-agent:8888
      NO_PROXY: localhost,127.0.0.1
      PIP_CACHE_DIR: /tmp/pip-cache-dir
      PIP_CONFIG_FILE: /tmp/pip-conf
      UV_CACHE_DIR: /tmp/uv-cache
      http_proxy: http://scb-egress-agent:8888
      https_proxy: http://scb-egress-agent:8888
      no_proxy: localhost,127.0.0.1
  name: python3.12
  setup:
    eval_commands:
    - uv init
    - uv add -r requirements.txt
    resume_commands:
    - python -m venv .venv || true
    - .venv/bin/pip install -r requirements.txt 2>/dev/null || true
  type: docker
environment_config_path: configs/environments/docker-python3.12-uv-parnas-agent.yaml
model:
  name: opus-5.5
  provider: anthropic
one_shot:
  enabled: false
  include_first_prefix: false
  prefix: ''
output_path: /home/niruthi/features/scbench/runs/metric_transform_lang/c4_performance_s1_20261109T1829
pass_policy: any
problems:
- metric_transform_lang
prompt_content: 'Implement a program that 100% solves the specification. That is all
  you need to do.

  {% if not is_continuation -%}

  Use a virtual environment and ensure that a `requirements.txt` is present with any
  dependencies you need to solve the problem.

  Before coding, write a brief design plan in `DESIGN.md`, then implement.

  The most important quality of this program is runtime speed and low memory use.
  Optimise for that.

  {% else -%}

  Keep using the same virtual environment you started with, update `requirements.txt`
  with any new dependencies you need.

  {% endif -%}


  Your task is:

  {{ spec.strip() }}

  '
prompt_path: configs/prompts/parnas/c4_performance.jinja
save_dir: /home/niruthi/features/scbench/runs
save_template: metric_transform_lang/c4_performance_s1_20261109T1829
thinking: high
thinking_max_tokens: null
