Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 64

# Only cells on the internal network can use the proxy.
Allow 0.0.0.0/0

# CONNECT is required for HTTPS; 443 only, so no plaintext exfiltration path
# and no arbitrary tunnelled port.
ConnectPort 443

# Host allowlist. FilterDefaultDeny inverts the file's meaning: anything NOT
# matched here is refused.
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterDefaultDeny Yes
